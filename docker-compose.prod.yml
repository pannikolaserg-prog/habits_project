services:
  db:
    image: postgres:15
    container_name: habits_db_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: habits_redis_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: habits_web_prod
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      DEBUG: "False"
      ALLOWED_HOSTS: "158.160.240.234"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    restart: unless-stopped

  celery:
    build: .
    container_name: habits_celery_prod
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --uid=nobody --gid=nogroup
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: habits_celery_beat_prod
    env_file:
      - .env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --uid=nobody --gid=nogroup -s /tmp/celerybeat-schedule   # добавлен -s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: habits_nginx_prod
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_prod: